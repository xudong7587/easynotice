name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source before publishing
        run: |
          npm ci
          npm run check
          npm test

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test data-directory permissions
        shell: bash
        run: |
          container="easynotice-smoke"
          data_dir="${RUNNER_TEMP}/easynotice-smoke-data"
          mkdir -p "$data_dir"
          sudo chown root:root "$data_dir"
          sudo chmod 755 "$data_dir"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --publish 18088:18088 \
            --volume "$data_dir:/app/data" \
            "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18088/health >/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            docker logs "$container"
            exit 1
          fi

          test "$(stat -c '%u' "$data_dir/uploads")" = "1000"
          docker exec "$container" node -e \
            "fetch('http://0.0.0.0:18088/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
          docker exec "$container" sh -c \
            'test "$(awk "/^Uid:/ { print \$2 }" /proc/1/status)" = "1000"'
