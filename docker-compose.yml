services:
  easynotice:
    image: ${EASYNOTICE_IMAGE:-ghcr.io/xudong7587/easynotice:latest}
    container_name: easynotice
    restart: unless-stopped
    ports:
      - "${EASYNOTICE_PORT:-18088}:18088"
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: 18088
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://0.0.0.0:18088/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
